backend:
  name: git-gateway
  branch: main

site_url: https://niallmcsheffrey.com
display_url: https://niallmcsheffrey.com
logo_url: /images/header.jpg

media_folder: src/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/posts
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} · {{date | date('D MMM YYYY')}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Post date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMM YYYY", time_format: false, picker_utc: true }
      - { label: Tags, name: topics, widget: list, required: false, hint: "e.g. music, roots, product" }
      - { label: Summary, name: description, widget: text, required: false, hint: "Optional. Shown on the home page; if blank, the first paragraph is used." }
      - { label: Post, name: body, widget: markdown }
  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: src/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: page.njk }
          - { label: Title, name: title, widget: hidden, default: About }
          - { label: Link, name: permalink, widget: hidden, default: /about/ }
          - { label: About text, name: body, widget: markdown }
